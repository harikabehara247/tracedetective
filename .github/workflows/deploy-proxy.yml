name: Deploy analysis service
# Deploys the PageSpeed proxy (worker/) to Cloudflare Workers when it changes on main, or on demand.
# Needs repository secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and PSI_API_KEY, and the
# repository variable PSI_PROXY_URL (the worker's https URL). See worker/README.md.
# The Google API key only ever lives in the PSI_API_KEY secret and in the Worker's secret store.
on:
  push:
    branches: [main]
    paths: ['worker/**', 'src/core/url.ts', '.github/workflows/deploy-proxy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-proxy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      HAS_KEY: ${{ secrets.PSI_API_KEY != '' }}
    steps:
      - name: Check configuration
        run: |
          if [ "$HAS_CLOUDFLARE" != "true" ]; then
            echo "::notice::Cloudflare secrets are not set, so the analysis service is not deployed. The site keeps calling Google's keyless endpoint. See worker/README.md."
          fi
      - uses: actions/checkout@v4
        if: env.HAS_CLOUDFLARE == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.HAS_CLOUDFLARE == 'true'
      - name: Test the proxy
        if: env.HAS_CLOUDFLARE == 'true'
        run: npx vitest run tests/worker.test.ts tests/pagespeed.test.ts tests/url.test.ts
      - name: Deploy the Worker
        if: env.HAS_CLOUDFLARE == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.165.0 deploy --var "ALLOWED_ORIGINS:https://${{ github.repository_owner }}.github.io"
      - name: Store the Google API key as a Worker secret
        if: env.HAS_CLOUDFLARE == 'true' && env.HAS_KEY == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        # Piped through stdin so the value never appears in a command line or the log.
        run: printf '%s' "$PSI_API_KEY" | npx --yes wrangler@4.165.0 secret put PSI_API_KEY
      - name: Health check
        if: env.HAS_CLOUDFLARE == 'true' && vars.PSI_PROXY_URL != ''
        env:
          PROXY: ${{ vars.PSI_PROXY_URL }}
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS "${PROXY%/}/health" || true)
            echo "health: $body"
            case "$body" in *'"keyConfigured":true'*) exit 0 ;; esac
            [ $i -lt 6 ] && sleep 10
          done
          echo "::error::The analysis service is up but reports no API key. Set the PSI_API_KEY secret and run this workflow again."
          exit 1
